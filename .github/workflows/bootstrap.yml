# .github/workflows/bootstrap.yml
# ─────────────────────────────────────────────────────────────────────────────
# ONE-TIME bootstrap — creates the S3 bucket + DynamoDB table used as
# Terraform remote state backend for all other workflows.
#
# Trigger: manually via GitHub Actions UI (workflow_dispatch) — run ONCE
# before any other workflow. Never needs to run again unless you recreate
# the AWS account or bucket.
#
# Required GitHub Secrets:
#   AWS_ROLE_ARN        — IAM role ARN for GitHub OIDC federation
#   AWS_REGION          — e.g. us-west-2
#   TF_STATE_BUCKET     — desired S3 bucket name (e.g. ecommerce-eks-tfstate)
#   TF_STATE_LOCK_TABLE — desired DynamoDB table name (e.g. ecommerce-eks-tflock)
# ─────────────────────────────────────────────────────────────────────────────

name: Bootstrap_Script

on:
  workflow_dispatch:                    # manual trigger only
    inputs:
      confirm:
        description: "Type 'bootstrap' to confirm"
        required: true

permissions:
  id-token: write                       # required for OIDC
  contents: read

jobs:
  bootstrap:
    name: Create S3 + DynamoDB
    runs-on: ubuntu-latest
    if: github.event.inputs.confirm == 'bootstrap'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── Authenticate to AWS via OIDC (no static keys) ──────────────────────
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}
          role-session-name: bootstrap-session

      # ── Create S3 bucket for Terraform state ───────────────────────────────
      - name: Create S3 state bucket
        run: |
          BUCKET="${{ secrets.TF_STATE_BUCKET }}"
          REGION="${{ secrets.AWS_REGION }}"

          # Check if bucket already exists
          if aws s3api head-bucket --bucket "$BUCKET" 2>/dev/null; then
            echo "✅ Bucket $BUCKET already exists — skipping creation."
          else
            echo "Creating bucket: $BUCKET"
            if [ "$REGION" = "us-west-2" ]; then
              aws s3api create-bucket --bucket "$BUCKET" --region "$REGION"
            else
              aws s3api create-bucket --bucket "$BUCKET" --region "$REGION" \
                --create-bucket-configuration LocationConstraint="$REGION"
            fi
            echo "✅ Bucket created."
          fi

          # Enable versioning
          aws s3api put-bucket-versioning \
            --bucket "$BUCKET" \
            --versioning-configuration Status=Enabled
          echo "✅ Versioning enabled."

          # Enable server-side encryption
          aws s3api put-bucket-encryption \
            --bucket "$BUCKET" \
            --server-side-encryption-configuration '{
              "Rules": [{
                "ApplyServerSideEncryptionByDefault": {
                  "SSEAlgorithm": "AES256"
                }
              }]
            }'
          echo "✅ Encryption enabled."

          # Block all public access
          aws s3api put-public-access-block \
            --bucket "$BUCKET" \
            --public-access-block-configuration \
              "BlockPublicAcls=true,IgnorePublicAcls=true,BlockPublicPolicy=true,RestrictPublicBuckets=true"
          echo "✅ Public access blocked."

      # ── Create DynamoDB table for state locking ────────────────────────────
      - name: Create DynamoDB lock table
        run: |
          TABLE="${{ secrets.TF_STATE_LOCK_TABLE }}"
          REGION="${{ secrets.AWS_REGION }}"

          if aws dynamodb describe-table --table-name "$TABLE" --region "$REGION" 2>/dev/null; then
            echo "✅ Table $TABLE already exists — skipping creation."
          else
            aws dynamodb create-table \
              --table-name "$TABLE" \
              --attribute-definitions AttributeName=LockID,AttributeType=S \
              --key-schema AttributeName=LockID,KeyType=HASH \
              --billing-mode PAY_PER_REQUEST \
              --region "$REGION"
            echo "✅ DynamoDB lock table created."
          fi

      - name: Bootstrap complete
        run: |
          echo "════════════════════════════════════════"
          echo "   Remote state infrastructure is ready."
          echo "   Bucket : ${{ secrets.TF_STATE_BUCKET }}"
          echo "   Table  : ${{ secrets.TF_STATE_LOCK_TABLE }}"
          echo "   Region : ${{ secrets.AWS_REGION }}"
          echo "════════════════════════════════════════"
          echo "You can now run terraform-dev.yml and terraform-prod.yml."