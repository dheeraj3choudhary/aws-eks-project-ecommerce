# .github/workflows/deploy-dev.yml
# ─────────────────────────────────────────────────────────────────────────────
# Full deploy pipeline for the dev environment:
#   1. Build frontend + backend Docker images
#   2. Push both to ECR
#   3. Install/upgrade infrastructure Helm charts:
#        - AWS Load Balancer Controller
#        - Cluster Autoscaler
#        - Prometheus (kube-prometheus-stack)
#        - Grafana
#        - Fluent Bit (logs → CloudWatch)
#   4. Deploy the ecommerce Helm chart with dev values
#
# Triggers:
#   - Push to main branch touching apps/** or helm/**
#   - Manual trigger (workflow_dispatch)
#
# Required GitHub Secrets:
#   AWS_ROLE_ARN        — IAM role for GitHub OIDC
#   AWS_REGION          — e.g. us-west-2
#   AWS_ACCOUNT_ID      — 12-digit AWS account ID
#   GRAFANA_ADMIN_PASSWORD — Grafana admin password
# ─────────────────────────────────────────────────────────────────────────────

name: Deploy_APP_Dev

on:
  push:
    branches: [dev]
    paths:
      - apps/**
      - helm/**
  workflow_run:
    workflows: ["Terraform_Infra_Dev"]
    types:
      - completed
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION:       ${{ secrets.AWS_REGION }}
  AWS_ACCOUNT_ID:   ${{ secrets.AWS_ACCOUNT_ID }}
  CLUSTER_NAME:     ecommerce-dev
  NAMESPACE:        ecommerce
  IMAGE_TAG:        ${{ github.sha }}

jobs:
  build-and-push:
    name: Build & Push Images
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') ||
      (github.event_name == 'push')

    outputs:
      frontend_image: ${{ steps.build-frontend.outputs.image }}
      backend_image:  ${{ steps.build-backend.outputs.image }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: deploy-dev-build-session

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build & push frontend image
        id: build-frontend
        working-directory: apps/frontend
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPO: ecommerce-frontend
        run: |
          IMAGE="$ECR_REGISTRY/$REPO:${{ env.IMAGE_TAG }}"
          LATEST="$ECR_REGISTRY/$REPO:latest"

          docker build -t "$IMAGE" -t "$LATEST" .
          docker push "$IMAGE"
          docker push "$LATEST"

          echo "image=$IMAGE" >> $GITHUB_OUTPUT

      - name: Build & push backend image
        id: build-backend
        working-directory: apps/backend
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPO: ecommerce-backend
        run: |
          IMAGE="$ECR_REGISTRY/$REPO:${{ env.IMAGE_TAG }}"
          LATEST="$ECR_REGISTRY/$REPO:latest"

          docker build -t "$IMAGE" -t "$LATEST" .
          docker push "$IMAGE"
          docker push "$LATEST"

          echo "image=$IMAGE" >> $GITHUB_OUTPUT

  deploy:
    name: Helm Deploy — Dev
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: dev
    if: |
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') ||
      (github.event_name == 'push')

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: deploy-dev-helm-session

      - name: Setup kubectl
        uses: azure/setup-kubectl@v3

      - name: Setup Helm
        uses: azure/setup-helm@v3

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig \
            --name ${{ env.CLUSTER_NAME }} \
            --region ${{ env.AWS_REGION }}

      - name: Get Terraform outputs
        working-directory: terraform/environments/dev
        run: |
          wget -q https://releases.hashicorp.com/terraform/1.7.5/terraform_1.7.5_linux_amd64.zip
          unzip -q terraform_1.7.5_linux_amd64.zip && sudo mv terraform /usr/local/bin/
          terraform init -backend=true
          echo "BACKEND_SA_ROLE_ARN=$(terraform output -raw backend_sa_role_arn)"         >> $GITHUB_ENV
          echo "ALB_CONTROLLER_ROLE_ARN=$(terraform output -raw alb_controller_role_arn)" >> $GITHUB_ENV

      - name: Add Helm repos
        run: |
          helm repo add eks https://aws.github.io/eks-charts
          helm repo add autoscaler https://kubernetes.github.io/autoscaler
          helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
          helm repo add grafana https://grafana.github.io/helm-charts
          helm repo add fluent https://fluent.github.io/helm-charts
          helm repo update

      - name: Install AWS Load Balancer Controller
        run: |
          helm upgrade --install aws-load-balancer-controller eks/aws-load-balancer-controller \
            --namespace kube-system \
            --create-namespace \
            -f helm/infrastructure/aws-load-balancer-controller/values.yaml \
            --set clusterName=${{ env.CLUSTER_NAME }} \
            --set serviceAccount.annotations."eks\.amazonaws\.com/role-arn"=${{ env.ALB_CONTROLLER_ROLE_ARN }} \
            --wait --timeout 5m

      - name: Install Cluster Autoscaler
        run: |
          helm upgrade --install cluster-autoscaler autoscaler/cluster-autoscaler \
            --namespace kube-system \
            -f helm/infrastructure/cluster-autoscaler/values.yaml \
            --set autoDiscovery.clusterName=${{ env.CLUSTER_NAME }} \
            --set awsRegion=${{ env.AWS_REGION }} \
            --wait --timeout 5m

      - name: Install Prometheus
        run: |
          helm upgrade --install prometheus prometheus-community/kube-prometheus-stack \
            --namespace monitoring \
            --create-namespace \
            -f helm/infrastructure/monitoring/prometheus-values.yaml \
            --wait --timeout 10m

      - name: Install Grafana
        run: |
          helm upgrade --install grafana grafana/grafana \
            --namespace monitoring \
            --create-namespace \
            -f helm/infrastructure/monitoring/grafana-values.yaml \
            --set adminPassword=${{ secrets.GRAFANA_ADMIN_PASSWORD }} \
            --wait --timeout 5m

      - name: Install Fluent Bit
        run: |
          helm upgrade --install fluent-bit fluent/fluent-bit \
            --namespace logging \
            --create-namespace \
            -f helm/infrastructure/logging/fluent-bit-values.yaml \
            --wait --timeout 5m

      - name: Deploy ecommerce Helm chart
        run: |
          ECR_BASE="${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com"

          helm upgrade --install ecommerce ./helm/ecommerce \
            --namespace ${{ env.NAMESPACE }} \
            --create-namespace \
            -f helm/ecommerce/values.yaml \
            -f helm/ecommerce/values-dev.yaml \
            --set frontend.image.repository="$ECR_BASE/ecommerce-frontend" \
            --set frontend.image.tag=${{ env.IMAGE_TAG }} \
            --set backend.image.repository="$ECR_BASE/ecommerce-backend" \
            --set backend.image.tag=${{ env.IMAGE_TAG }} \
            --set serviceAccount.roleArn=${{ env.BACKEND_SA_ROLE_ARN }} \
            --set global.awsAccountId=${{ env.AWS_ACCOUNT_ID }} \
            --atomic \
            --timeout 10m \
            --wait

      - name: Verify deployment
        run: |
          kubectl rollout status deployment/frontend -n ${{ env.NAMESPACE }} --timeout=5m
          kubectl rollout status deployment/backend  -n ${{ env.NAMESPACE }} --timeout=5m

      - name: Print ALB endpoint
        run: |
          kubectl get ingress -n ${{ env.NAMESPACE }} \
            -o jsonpath='{.items[0].status.loadBalancer.ingress[0].hostname}'
